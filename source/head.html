.stats>h3,.stats>.dim,.stats>.stsec,.stats>.uq,.stats>div[style*="display:block"]{grid-column:1/-1}
.stats>h3{margin:0 0 2px!important}

/* ---- rarity presentation ---- */
.cell{position:relative;overflow:hidden}
.cell.r3{box-shadow:0 0 8px rgba(196,107,255,.35)}
.cell.r4::after,.cell.r5::after,.cell.r7::after,.cell.r8::after,.cell.r9::after,.cell.r10::after,.cell.r11::after{content:'';position:absolute;inset:-40%;background:linear-gradient(115deg,transparent 40%,rgba(255,255,255,.38) 50%,transparent 60%);animation:shine 3.2s ease-in-out infinite;pointer-events:none}
@keyframes shine{0%,55%{transform:translateX(-60%)}100%{transform:translateX(60%)}}
.cell.r4{box-shadow:0 0 12px rgba(255,154,46,.6),inset 0 0 10px rgba(255,154,46,.25)}
.cell.r5{box-shadow:0 0 14px rgba(255,62,94,.75),inset 0 0 12px rgba(255,62,94,.3);animation:pulse 2.2s infinite}.cell.r5::after{animation-duration:2.4s}
.cell.r7::before,.cell.r8::before,.cell.r9::before,.cell.r10::before,.cell.r11::before{content:'';position:absolute;inset:-60%;background:conic-gradient(from 0deg,transparent 0 70%,var(--rcol,#fff) 80%,transparent 90%);animation:spin 3s linear infinite;opacity:.55;pointer-events:none;z-index:0}
.cell.r7{--rcol:#e0c27a}.cell.r8{--rcol:#ffffff}.cell.r9{--rcol:#ff7a2a}.cell.r10{--rcol:#ffe94a}.cell.r11{--rcol:#ff5af0}
.cell.r7::after{animation-duration:2.6s}.cell.r9::before{animation-duration:2.2s}.cell.r10::before{animation-duration:1.8s}.cell.r11::before{animation-duration:1.4s;background:conic-gradient(#ff5af0,#5affff,#ffe94a,#ff5af0);opacity:.6}
.cell.r11{animation:hue 6s linear infinite}@keyframes hue{to{filter:hue-rotate(360deg)}}
@keyframes spin{to{transform:rotate(360deg)}}
.cell>*{position:relative;z-index:1}
#tip .tc{position:relative;overflow:hidden}
#tip .tc::before{content:'';position:absolute;left:0;right:0;top:0;height:64px;background:linear-gradient(180deg,color-mix(in srgb,var(--rc,#888) 28%,transparent),transparent);pointer-events:none}
#tip .tc .rchip{position:relative;display:inline-block;font:bold 10px 'Trebuchet MS',sans-serif;letter-spacing:1.6px;text-transform:uppercase;color:var(--rc,#ccc);border:1px solid color-mix(in srgb,var(--rc,#888) 60%,transparent);border-radius:8px;padding:1px 8px;margin-bottom:4px;background:rgba(0,0,0,.35)}
#tip .tc.rt4,#tip .tc.rt5,#tip .tc.rt6,#tip .tc.rt7,#tip .tc.rt8,#tip .tc.rt9,#tip .tc.rt10,#tip .tc.rt11{border-color:var(--rc)!important;box-shadow:0 0 22px color-mix(in srgb,var(--rc) 45%,transparent),0 10px 34px #000!important}
#tip .tc.rt4 .tn,#tip .tc.rt5 .tn,#tip .tc.rt6 .tn{text-shadow:0 0 12px var(--rc)}
#tip .tc.rt7 .tn,#tip .tc.rt8 .tn,#tip .tc.rt9 .tn,#tip .tc.rt10 .tn,#tip .tc.rt11 .tn{text-shadow:0 0 14px var(--rc),0 0 28px var(--rc);font-size:19px!important;letter-spacing:.5px}
#tip .tc.rt11 .tn{background:linear-gradient(90deg,#ff5af0,#5affff,#ffe94a,#ff5af0);-webkit-background-clip:text;background-clip:text;color:transparent!important;background-size:200%;animation:grad 3s linear infinite}@keyframes grad{to{background-position:200% 0}}
#tip .tc.rt8::after,#tip .tc.rt9::after,#tip .tc.rt10::after,#tip .tc.rt11::after{content:'';position:absolute;inset:0;background:linear-gradient(115deg,transparent 42%,rgba(255,255,255,.07) 50%,transparent 58%);animation:shine 4s ease-in-out infinite;pointer-events:none}
#lootfeed div.lf4,#lootfeed div.lf5,#lootfeed div.lf6,#lootfeed div.lf7,#lootfeed div.lf8{box-shadow:0 0 16px color-mix(in srgb,var(--rc) 55%,transparent),0 3px 10px rgba(0,0,0,.5)!important;background:linear-gradient(90deg,color-mix(in srgb,var(--rc) 22%,rgba(14,11,22,.95)),rgba(14,11,22,.8))!important;font-weight:bold}
.bgrid{grid-template-columns:repeat(3,minmax(0,1fr))!important;gap:6px 10px!important}
.bgrid>.card{margin:0!important;padding:7px 10px!important;font-size:12.5px}.bgrid>.card .dim{font-size:11.5px}
.achg{grid-template-columns:repeat(3,minmax(0,1fr))!important;gap:6px 10px!important}.achg>.card{margin:0!important;padding:6px 10px!important}.ach .ai{font-size:22px!important}
.setgrid{display:grid;grid-template-columns:1fr 1fr;gap:6px 12px;align-items:stretch}.setgrid>.card{margin:0!important;padding:6px 12px!important;display:block!important;text-align:center;font-size:13.5px}.setgrid>.card .btn{margin:2px 3px;padding:4px 11px;font-size:12.5px}.setgrid>.card .dim{font-size:11.5px;line-height:1.3}
.panel.setp{width:min(1100px,94vw)}
.setgrid>.card:has(.kbb){grid-column:1/-1}
.hline{font-size:12px;margin-top:3px}.hline:empty{display:none}

/* ---- global flatten: no glows, no blur, no soft rounding, one pixel font ---- */
#px *,#px *::before,#px *::after{text-shadow:1px 1px 0 rgba(0,0,0,.9)!important;box-shadow:none!important;backdrop-filter:none!important;-webkit-backdrop-filter:none!important;border-radius:0!important;}
html,body{color:var(--text);}
#px canvas{image-rendering:auto}
::selection{background:var(--gold);color:var(--ink);text-shadow:none}
h1,h2,h3,.tab,.fitt{font-weight:600}
.dim{color:var(--dim)}
.up{color:#7fe07f}.dn{color:#ff7a6a}

/* ---- reusable frames ---- */
#px :is(.hpan,#h-target,#lvcard,#tutbox,#hintbox,.dlgbox,#freeze .fz){border-style:solid!important;border-width:6px!important;border-color:transparent!important;border-image-source:var(--f-tip)!important;border-image-slice:3!important;border-image-width:1!important;border-image-repeat:stretch!important;background-color:var(--bg)!important;background-clip:padding-box!important;background-image:repeating-conic-gradient(rgba(255,255,255,.03) 0 25%,transparent 0 50%)!important;background-size:4px 4px!important}
#px :is(.panel:not(.ttl):not(.dlg),#tip .tc){border-style:solid!important;border-width:8px!important;border-color:transparent!important;border-image-source:var(--f-panel)!important;border-image-slice:4!important;border-image-width:1!important;border-image-repeat:stretch!important;background-color:var(--bg)!important;background-clip:padding-box!important;background-image:repeating-conic-gradient(rgba(255,255,255,.028) 0 25%,transparent 0 50%)!important;background-size:4px 4px!important;padding:14px 20px!important;animation:none!important}
#px #tip .tc{border-width:6px!important;border-image-source:var(--f-tip)!important;border-image-slice:3!important;padding:9px 12px!important}
#px #tip .tc::before,#px #tip .tc::after{content:none!important}
#px #tip .tc[class*=rt]{border-image-source:var(--f-panelhi)!important;border-image-slice:4!important;border-width:8px!important}
#px #tip .tc .tn{background:none!important;-webkit-background-clip:initial!important;background-clip:initial!important;color:var(--rc,var(--text))!important;animation:none!important;font-size:18px!important;letter-spacing:0!important}
#px #tip .tc .rchip{font-size:9px!important;letter-spacing:1px!important;border:2px solid var(--rc,#888)!important;padding:1px 5px!important;background:var(--ink)!important}
#px #tip hr{border-top:2px solid #3b3144!important}
#px #tip .tn{border-bottom:2px solid #3b3144!important}
#px .ov{background:repeating-conic-gradient(rgba(0,0,0,.4) 0 25%,transparent 0 50%) 0 0/4px 4px,rgba(6,4,10,.62)!important}
#px .panel.tabbed,#px .panel.setp{box-sizing:border-box}
#px .panel h2{font-size:26px!important;color:var(--gold)!important;letter-spacing:1px!important;border-bottom:2px solid #3b3144!important;padding-bottom:6px!important}
#px .panel h3,#px h3{color:#e8b858!important;letter-spacing:.5px!important}
#px .panel h3::after{background:#3b3144!important;height:2px!important}
#px .pclose{width:30px!important;height:30px!important;line-height:26px!important;border:2px solid var(--ink)!important;background:#5a2a22!important;color:#ffe9d8!important;top:-4px}
#px .pclose:hover{background:#b0402f!important}

#px .panel.ttl,#px .panel.dlg{background:none!important;background-image:none!important;border:none!important;border-image:none!important;padding:0!important}
#px .panel.ttl{padding:18px 24px!important}
/* ---- buttons ---- */
#px .btn{border-style:solid!important;border-width:4px!important;border-color:transparent!important;border-image-source:var(--f-btn)!important;border-image-slice:2!important;border-image-width:1!important;border-image-repeat:stretch!important;background-color:#4e381a!important;background-image:none!important;background-clip:padding-box!important;box-shadow:inset 0 -3px 0 rgba(0,0,0,.35)!important;padding:4px 13px 5px!important;color:#ffe2a8!important;transition:none!important;letter-spacing:.3px}
#px .btn:hover{border-image-source:var(--f-btnhi)!important;background-color:#6b4b22!important;transform:none!important;color:#fff3cc!important}
#px .btn:active{border-image-source:var(--f-btnpress)!important;box-shadow:inset 0 3px 0 rgba(0,0,0,.4)!important;padding:6px 13px 3px!important;transform:none!important}
#px .btn.on{border-image-source:var(--f-btnon)!important;background-color:#c9923c!important;color:#1a1008!important;text-shadow:none!important;box-shadow:inset 0 -3px 0 rgba(0,0,0,.25)!important}
#px .btn.dis{opacity:.4!important}
#px .btn.bigb{font-size:20px!important;padding:10px 30px 12px!important;background-color:#3e2c14!important}
#px .btn.bigb:hover{background-color:#6b4b22!important}

/* ---- tabs, hub, cards ---- */
#px .tabs{border-bottom:2px solid #3b3144!important}
#px .tab{border:2px solid transparent!important;border-bottom:none!important;color:#b8a888!important;padding:5px 13px!important}
#px .tab:hover{background:#2b2336!important;color:#ffe2a8!important}
#px .tab.on{background:#2b2336!important;border-color:var(--ink)!important;box-shadow:inset 0 3px 0 var(--gold)!important;color:var(--gold)!important}
#px .tabs.sub .tab{border:2px solid #3b3144!important}
#px .tabs.sub .tab.on{border-color:var(--gold)!important;box-shadow:none!important}
#px .fitbar{background:var(--bg2)!important;border:2px solid #3b3144!important;padding:6px!important}
#px .fitt{border:2px solid transparent!important;color:#c8b090!important}
#px .fitt:hover{background:#2b2336!important;border-color:#5a4f66!important;color:#ffe2a8!important}
#px .fitt.on{background:#5a4220!important;border-color:var(--gold)!important;color:#fff3d0!important}
#px .hubsec{font-size:10px!important;letter-spacing:1px!important;color:#c19a55!important}
#px .hubsec::after{background:#3b3144!important;height:2px!important}
#px .hubt{background:var(--bg2)!important;background-image:none!important;border:2px solid #3b3144!important;transition:none!important}
#px .hubt:hover{border-color:var(--gold)!important;background:#2b2336!important;transform:none!important}
#px .hubt .hi{filter:none!important;transition:none!important}#px .hubt:hover .hi{transform:none!important}
#px .hubt b{color:#f4d9a0!important}
#px .hubt i,#px .mb i,#px .cell i{background:#4fb34f!important;color:var(--ink)!important;text-shadow:none!important;border:2px solid var(--ink)!important;font-size:8px!important;line-height:11px!important;padding:0 3px!important}
#px .card{background:var(--bg2)!important;background-image:none!important;border:2px solid #3b3144!important;transition:none!important}
#px .card:hover{border-color:#7a5c36!important}
#px .card.done{border-color:#b88a3e!important;background:#2a2314!important}
#px .card.lock{opacity:.5}
#px .cls .card:hover{transform:none!important;border-color:var(--gold)!important}
#px .stats{background:var(--bg2)!important;border:2px solid #3b3144!important}
#px .stsec,#px .stats .stsec{font-size:9px!important;letter-spacing:1px!important;color:#c19a55!important;border-bottom:2px solid #3b3144!important}
#px .sthi{background:#2e2616!important}
#px .stats>div:not(.stsec):not(.uq):hover{background:#2b2336!important}
#px .branch{background:var(--bg2)!important;border:2px solid #3b3144!important}
#px .tier{background:#120e18!important;border:2px solid #2b2336!important}
#px .tier .req{background:var(--ink)!important;border:2px solid #5a3a2a!important}
#px .node{background:#1a1520!important;border:2px solid #3b3144!important}
#px .node.act{border-color:#6a5a8a!important}#px .node.has{background:#2a2234!important;border-color:#c19a55!important}
#px .plus{background:#3e8a3e!important;border:2px solid var(--ink)!important;width:20px!important;height:20px!important;line-height:16px!important}
#px .bk{border:2px solid #3b3144!important}#px .bk.on{background:var(--gold)!important;color:var(--ink)!important;text-shadow:none!important;border-color:var(--ink)!important}
#px .gemb{background:#1a1520!important;border:2px solid #3b3144!important}#px .gemb.on{border-color:var(--gold)!important}
#px .sock{border:2px dashed #6a5a4a!important;background:#14101a!important}#px .sock.f{border:2px solid #c19a55!important;background:#2a2234!important}
#px .sw{border:2px solid #555!important}#px .sw.on{border-color:#fff!important}
#px .star{background:#1a1520!important;border:2px solid #3b3144!important}
#px .logl{background:#1a1520!important;border-left:3px solid #7a5c36!important}
#px .unlhint,#px .mtip{background:#18202e!important;border:2px dashed #4a6a9a!important;color:#cfe0f8!important}
#px .smrow{border-bottom:2px solid #2b2336!important}
#px .recb{background:var(--gold)!important;background-image:none!important;color:var(--ink)!important;text-shadow:none!important;border:2px solid var(--ink)!important;animation:none!important;font-size:9px!important}

/* ---- item cells, rarity as colour + frame weight (no glow, no shine, no animation) ---- */
#px .cell{box-sizing:border-box!important;width:48px!important;height:48px!important;margin:2px!important;border:2px solid var(--rc,#6a6272)!important;background:color-mix(in srgb,var(--rc,#8d8d95) 12%,#15111b)!important;background-image:none!important;box-shadow:inset 0 0 0 2px var(--ink)!important;overflow:hidden;animation:none!important;transition:none!important;filter:none!important}
#px .cell:hover{filter:none!important;transform:none!important;border-color:#fff!important}
#px .cell.empty{opacity:.35}
#px .cell::before,#px .cell::after{content:none!important;animation:none!important}
#px .cell b{font-size:12px!important;color:#fff3c8!important}
#px .cell.r0{--rc:#8d8d95}#px .cell.r1{--rc:#4fc34f}#px .cell.r2{--rc:#3f8fff}#px .cell.r3{--rc:#b45cff}#px .cell.r4{--rc:#ff9a2e}#px .cell.r5{--rc:#ff3e5e}#px .cell.r6{--rc:#7ffcff}#px .cell.r7{--rc:#e0c27a}#px .cell.r8{--rc:#f2f4ff}#px .cell.r9{--rc:#ff6a1a}#px .cell.r10{--rc:#ffe94a}#px .cell.r11{--rc:#ff5af0}
#px .cell:is(.r4,.r5,.r6){box-shadow:inset 0 0 0 2px var(--ink),inset 0 0 0 4px color-mix(in srgb,var(--rc) 55%,transparent)!important}
#px .cell:is(.r7,.r8,.r9,.r10,.r11){box-shadow:inset 0 0 0 2px var(--ink),inset 0 0 0 4px var(--rc),inset 0 0 0 6px var(--ink)!important}
#px .cell>*{position:relative}
#px .eqrow{color:var(--dim)!important}

/* ---- in-game HUD ---- */
#px #h-tl{padding:8px 12px!important}

/* ================= SMOOTH UI MODE (only when body has .smooth; Settings > Interface style) (final layer over the pixel UI: soft corners, clean thin borders, gentle depth) ================= */
html #px.smooth{--r-lg:16px;--r-md:12px;--r-sm:9px;--r-xs:6px;--edge:1px solid rgba(193,154,85,.55);--edge2:1px solid #3b3144;--depth:0 6px 18px rgba(0,0,0,.38)}
/* clean frames instead of pixel border-images */
html #px.smooth :is(.hpan,#h-target,#lvcard,#tutbox,#hintbox,.dlgbox,#freeze .fz,#h-slots,.panel:not(.ttl):not(.dlg),#tip .tc,#tip .tc[class*=rt]){border-image:none!important;border:var(--edge)!important;border-radius:var(--r-md)!important;box-shadow:var(--depth)!important}
html #px.smooth .panel:not(.ttl):not(.dlg){border-radius:var(--r-lg)!important;box-shadow:0 18px 60px rgba(0,0,0,.55)!important}
html #px.smooth .dlgbox{border-radius:var(--r-lg)!important}
html #px.smooth #tip .tc{border-radius:var(--r-md)!important}
html #px.smooth #tip .tc[class*=rt]{border-color:var(--rc,#c19a55)!important;border-width:1.5px!important}
html #px.smooth #tip .tc .rchip{border-radius:20px!important;border-width:1px!important}
html #px.smooth #h-slots{border-radius:var(--r-lg)!important;padding:7px!important}
/* buttons */
html #px.smooth :is(.btn,.mb){border-image:none!important;border:1px solid #8a6a3a!important;border-radius:var(--r-sm)!important;box-shadow:0 2px 0 rgba(0,0,0,.35)!important}
html #px.smooth :is(.btn,.mb):hover{border-color:var(--gold)!important}
html #px.smooth .btn:active{box-shadow:inset 0 2px 3px rgba(0,0,0,.4)!important;padding:5px 13px 4px!important}
html #px.smooth .btn.on{border-color:#ffd88a!important}
html #px.smooth .btn.bigb{border-radius:var(--r-md)!important}
html #px.smooth .pclose{border-radius:var(--r-sm)!important;border:1px solid rgba(255,255,255,.15)!important}
/* slots & item cells */
html #px.smooth .slot{border-image:none!important;border:1.5px solid #4a3c2c!important;border-radius:var(--r-md)!important}
html #px.smooth .slot.ready,html #px.smooth .slot:hover{border-color:#c19a55!important}
html #px.smooth .slot.surge{border-radius:50%!important}html #px.smooth .slot.surge.full{border-color:var(--gold)!important}
html #px.smooth .slot .key,html #px.smooth .slot .mpc{border-radius:var(--r-xs)!important}
html #px.smooth .cell{border-radius:var(--r-sm)!important;border-width:1.5px!important}
html #px.smooth .cell:is(.r4,.r5,.r6),html #px.smooth .cell:is(.r7,.r8,.r9,.r10,.r11){box-shadow:inset 0 0 0 2px color-mix(in srgb,var(--rc) 35%,transparent),0 0 0 1px color-mix(in srgb,var(--rc) 45%,transparent)!important}
html #px.smooth :is(.hubt i,.mb i,.cell i){border-radius:20px!important;border-width:1px!important}
/* tabs, cards, hub, panels inside menus */
html #px.smooth .tab{border-radius:var(--r-sm) var(--r-sm) 0 0!important}
html #px.smooth .tabs.sub .tab{border-radius:20px!important;border-width:1px!important}
html #px.smooth .fitbar{border-radius:var(--r-md)!important;border:var(--edge2)!important}html #px.smooth .fitt{border-radius:var(--r-sm)!important;border-width:1px!important}
html #px.smooth :is(.card,.hubt,.stats,.branch,.tier,.node,.gemb,.star,.unlhint,.mtip,.fitpg .pgn){border-radius:var(--r-md)!important;border-width:1px!important}
html #px.smooth :is(.tier .req,.plus,.bk,.sock,.recb,.rchip,.sbadge){border-radius:var(--r-xs)!important;border-width:1px!important}
html #px.smooth .sw{border-radius:50%!important}
html #px.smooth .logl{border-radius:var(--r-xs)!important}
html #px.smooth .smrow{border-bottom:1px solid #2b2336!important}
html #px.smooth .panel h2,html #px.smooth .tabs,html #px.smooth #tip hr,html #px.smooth #tip .tn{border-width:1px!important}
html #px.smooth .panel h3::after,html #px.smooth .hubsec::after{height:1px!important}
/* bars */
html #px.smooth :is(.pbar,.qbar,.cbar,#h-target .tbar){border-radius:20px!important;overflow:hidden;outline:none!important;border:1px solid #2b2336!important}
html #px.smooth :is(.pbar div,.qbar div,.cbar div,#h-target .tbar div){border-radius:20px!important}
html #px.smooth #h-boss .bbar{border-radius:20px!important;outline:none!important;border:1.5px solid #7a5c36!important;overflow:hidden}
html #px.smooth #h-xp{border-radius:20px!important;outline:none!important;border:1.5px solid #7a5c36!important;overflow:hidden}
html #px.smooth #h-xp .lvb{border-radius:20px 0 0 20px!important}html #px.smooth #h-xp .trk{border-radius:0 20px 20px 0;overflow:hidden}
html #px.smooth #h-xp .fill{transition:width .3s ease-out!important}
/* HUD pieces */
html #px.smooth .buff{border-radius:var(--r-sm)!important}
html #px.smooth .globe{outline:none!important;border:3px solid #7a5c36!important;box-shadow:0 0 0 2px var(--ink),var(--depth)!important}
html #px.smooth .hpan.mini,html #px.smooth .mini{outline:none!important;border:3px solid #7a5c36!important;box-shadow:0 0 0 2px var(--ink),var(--depth)!important}
html #px.smooth .fpips i{border-radius:20px!important;border-width:1px!important}
html #px.smooth #lootfeed div,html #px.smooth #toast div{border-radius:var(--r-sm)!important;border-width:1px!important}
html #px.smooth #lootfeed div{border-left-width:3px!important}
html #px.smooth #toast div{border-left-width:4px!important;box-shadow:var(--depth)!important}
html #px.smooth .dport{border-radius:50%!important}
html #px.smooth #tutbox .tdots i{border-radius:20px!important}
html #px.smooth #tutbox .ttip{border-radius:var(--r-xs)!important}
/* inputs & scrollbars */
html #px.smooth input[type=range]{border-radius:20px!important;border-width:1px!important}
html #px.smooth input[type=range]::-webkit-slider-thumb{border-radius:50%!important;width:16px!important;height:16px!important;border-width:2px!important;box-shadow:none!important}
html #px.smooth ::-webkit-scrollbar-thumb{border-radius:10px!important}
html #px.smooth input,html #px.smooth select{border-radius:var(--r-sm)!important}
/* cleaner spacing */
html #px.smooth .panel h2{margin-bottom:10px!important}
html #px.smooth .card{padding:9px 12px!important}

/* ================= GLOW & SPECIAL EFFECTS (final layer — applies in both Smooth and Pixel styles) ================= */
@keyframes fxShine{0%,55%{transform:translateX(-60%)}100%{transform:translateX(60%)}}
@keyframes fxSpin{to{transform:rotate(360deg)}}
@keyframes fxPulse{0%,100%{filter:brightness(1)}50%{filter:brightness(1.35)}}
@keyframes fxHue{to{filter:hue-rotate(360deg)}}
@keyframes fxGrad{to{background-position:200% 0}}
@keyframes fxBreath{0%,100%{opacity:.55}50%{opacity:1}}
@keyframes fxFlash{0%{box-shadow:0 0 0 0 rgba(255,220,140,.9),inset 0 0 20px rgba(255,220,140,.6)}100%{box-shadow:0 0 0 14px rgba(255,220,140,0),inset 0 0 10px rgba(255,200,100,.15)}}
@keyframes fxBeat{0%,100%{box-shadow:0 0 0 2px #0d0a11,0 0 0 0 rgba(255,40,40,0)}25%{box-shadow:0 0 0 2px #0d0a11,0 0 26px 8px rgba(255,40,40,.85)}}
@keyframes fxWave{to{transform:translateX(25%)}}
@keyframes fxRise{0%{transform:translateY(0) translateX(0);opacity:0}10%{opacity:.95}100%{transform:translateY(-105vh) translateX(40px);opacity:0}}
@keyframes fxXpg{0%{filter:brightness(2)}100%{filter:none}}
@keyframes fxLv{0%{box-shadow:0 0 0 0 rgba(255,210,122,.9),0 0 30px 10px rgba(255,210,122,.8)}100%{box-shadow:0 0 0 0 transparent}}
/* ---- item cells: rarity glow, shine sweep, rotating rings ---- */
html body#px:is(.smooth,:not(.smooth)) .cell{position:relative;overflow:hidden}
html body#px:is(.smooth,:not(.smooth)) .cell.r2{box-shadow:0 0 6px rgba(63,143,255,.35)!important}
html body#px:is(.smooth,:not(.smooth)) .cell.r3{box-shadow:0 0 9px rgba(180,92,255,.55)!important}
html body#px:is(.smooth,:not(.smooth)) .cell.r4{box-shadow:0 0 12px rgba(255,154,46,.75),inset 0 0 10px rgba(255,154,46,.3)!important}
html body#px:is(.smooth,:not(.smooth)) .cell.r5{box-shadow:0 0 15px rgba(255,62,94,.85),inset 0 0 12px rgba(255,62,94,.35)!important;animation:fxPulse 2.2s infinite!important}
html body#px:is(.smooth,:not(.smooth)) .cell.r6{box-shadow:0 0 16px #7ffcff,inset 0 0 10px rgba(127,252,255,.4)!important;animation:fxPulse 2s infinite!important}
html body#px:is(.smooth,:not(.smooth)) .cell:is(.r7,.r8,.r9,.r10,.r11){box-shadow:0 0 18px var(--rc),inset 0 0 12px color-mix(in srgb,var(--rc) 45%,transparent)!important}
html body#px:is(.smooth,:not(.smooth)) .cell:is(.r4,.r5,.r6,.r7,.r8,.r9,.r10,.r11)::after{content:''!important;position:absolute;inset:-40%;background:linear-gradient(115deg,transparent 40%,rgba(255,255,255,.4) 50%,transparent 60%);animation:fxShine 3.2s ease-in-out infinite!important;pointer-events:none;z-index:2}
html body#px:is(.smooth,:not(.smooth)) .cell.r5::after{animation-duration:2.4s!important}
html body#px:is(.smooth,:not(.smooth)) .cell:is(.r7,.r8,.r9,.r10,.r11)::before{content:''!important;position:absolute;inset:-60%;background:conic-gradient(from 0deg,transparent 0 70%,var(--rc) 80%,transparent 90%);animation:fxSpin 3s linear infinite!important;opacity:.6;pointer-events:none;z-index:0}
html body#px:is(.smooth,:not(.smooth)) .cell.r9::before{animation-duration:2.2s!important}html body#px:is(.smooth,:not(.smooth)) .cell.r10::before{animation-duration:1.7s!important}

html body#px:is(.smooth,:not(.smooth)) .cell.rset{box-shadow:0 0 10px var(--sc,#5ae0a0),inset 0 0 8px color-mix(in srgb,var(--sc,#5ae0a0) 40%,transparent)!important}

#fxflash{position:fixed;inset:0;pointer-events:none;z-index:25;opacity:0;transition:opacity .5s}

svg.gi,img.gi{width:1.15em;height:1.15em;display:inline-block;vertical-align:-.2em;fill:currentColor;flex:none}
img.gi{object-fit:contain}
svg.gi.gc{filter:drop-shadow(0 1px 0 rgba(0,0,0,.9)) drop-shadow(0 0 3px rgba(0,0,0,.6))}
svg.gi.big,img.gi.big{width:2em;height:2em}
.gi-item{position:relative;display:inline-block;width:1.6em;height:1.6em;vertical-align:middle;line-height:0}

.gi-item.inf>img.gi{filter:drop-shadow(0 0 3px var(--inf)) drop-shadow(0 0 1px var(--inf))}

.cell.r9 .gi-item,.cell.r10 .gi-item,.cell.r11 .gi-item{animation:giShim 2.6s ease-in-out infinite}
